name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
            asset_name: linux-x64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
            linker: aarch64-linux-gnu-gcc
            asset_name: linux-arm64
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
            asset_name: macos-x64
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
            asset_name: macos-arm64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
            asset_name: windows-x64
            msi: true
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            archive: zip
            asset_name: windows-arm64
            msi: true

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross-compilation linker
        if: matrix.linker
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=${{ matrix.linker }}" >> "$GITHUB_ENV"

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package (tar.gz)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          name="ani-tui-${{ github.ref_name }}-${{ matrix.asset_name }}"
          mkdir "$name"
          cp target/${{ matrix.target }}/release/ani-tui "$name/"
          cp README.md LICENSE "$name/"
          tar czf "$name.tar.gz" "$name"

      - name: Package (zip)
        if: matrix.archive == 'zip'
        shell: bash
        run: |
          name="ani-tui-${{ github.ref_name }}-${{ matrix.asset_name }}"
          mkdir "$name"
          cp target/${{ matrix.target }}/release/ani-tui.exe "$name/"
          cp README.md LICENSE "$name/"
          7z a "$name.zip" "$name"

      - uses: actions/upload-artifact@v4
        with:
          name: ani-tui-${{ matrix.asset_name }}
          path: ani-tui-${{ github.ref_name }}-${{ matrix.asset_name }}.${{ matrix.archive }}

      - name: Install WiX Toolset
        if: matrix.msi
        shell: pwsh
        run: choco install wixtoolset -y --no-progress

      - name: Install cargo-wix
        if: matrix.msi
        run: cargo install cargo-wix --locked

      - name: Package (msi)
        if: matrix.msi
        shell: bash
        run: |
          cargo wix --no-build --target ${{ matrix.target }} --nocapture --output target/wix/
          mv target/wix/*.msi "ani-tui-${{ github.ref_name }}-${{ matrix.asset_name }}.msi"

      - uses: actions/upload-artifact@v4
        if: matrix.msi
        with:
          name: ani-tui-${{ matrix.asset_name }}-msi
          path: ani-tui-${{ github.ref_name }}-${{ matrix.asset_name }}.msi

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
