[package]
name = "ani-tui"
keywords = ["cli", "anime", "mpv"]
version = "1.2.0"
authors = ["m-kuzmin"]
description = "Watch anime from the shell via mpv"
documentation = "https://docs.rs/ani-tui"
repository = "https://github.com/ShifuRain/ani-tui"
edition = "2021"
readme = "README.md"
license = "GPL-3.0"
categories = ["command-line-utilities"]
include = ["/src", "/tests", "/README.md", "Cargo.lock", "Cargo.toml", "LICENSE"]

[dependencies]
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
futures = "0.3"
regex = "1"
easy-scraper = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
ratatui = { version = "0.29", features = ["serde"] }
crossterm = { version = "0.28", features = ["event-stream"] }
serde_norway = "0.9"
directories = "6"
